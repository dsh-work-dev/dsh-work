# nfpm package definition for the Linux desktop build.
# See https://nfpm.goreleaser.com for the schema.

name: "dsh-work"
arch: ${GOARCH}
platform: "linux"
version: "0.1.0"
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "Local-first desktop host for DeepSeek Harness"
vendor: "dsh-work"
homepage: "https://github.com/dsh-work-dev/dsh-work"
release: "1"

contents:
  - src: "./bin/dsh-work"
    dst: "/usr/local/bin/dsh-work"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/dsh-work.png"
  - src: "./build/linux/dsh-work.desktop"
    dst: "/usr/share/applications/dsh-work.desktop"

# GTK4 + WebKitGTK 6.0 stack (Ubuntu 24.04+ / Debian 13+)
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

overrides:
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  postremove: "./build/linux/nfpm/scripts/postremove.sh"
