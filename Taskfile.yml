version: '3'

vars:
  APP_NAME: dsh-work
  BIN_DIR: bin
  DSH_VERSION: 0.1.5-rc.2

tasks:
  default:
    cmds:
      - task: verify

  verify:
    summary: Run all local checks that do not require a real DSH runtime
    deps:
      - verify:toolchain
      - format:check
      - docs:check
      - dev:check
      - test
      - frontend:test
      - frontend:typecheck
      - frontend:build
      - build
      - build:dsh-work

  verify:toolchain:
    summary: Check the locked local toolchain
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-toolchain.ps1
      - node scripts/verify-node.mjs

  docs:check:
    summary: Check public-content and Git hygiene contracts
    cmds:
      - node scripts/check-public-content.mjs

  dev:check:
    summary: Check the Wails development server contract
    cmds:
      - node scripts/check-wails-dev.mjs

  format:
    summary: Format Go source
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/format-go.ps1

  format:check:
    summary: Ensure Go source is formatted
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-gofmt.ps1

  test:
    summary: Run the complete Go unit and contract suite
    deps:
      - worker:assets
    cmds:
      - go test . ./cmd/... ./internal/...

  frontend:install:
    run: once
    summary: Install the locked frontend dependencies
    dir: frontend
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/*
    cmds:
      - npm ci

  frontend:test:
    summary: Run frontend state-contract tests
    dir: frontend
    deps:
      - frontend:install
    cmds:
      - npm run test

  frontend:typecheck:
    summary: Typecheck the frontend and generated bindings
    dir: frontend
    deps:
      - frontend:install
      - generate:bindings
    cmds:
      - npm run typecheck
      - node node_modules/typescript/bin/tsc --project ../internal/desktopbridge/tsconfig.json

  frontend:build:
    run: once
    summary: Build the trusted frontend assets
    dir: frontend
    deps:
      - frontend:install
      - generate:bindings
    cmds:
      - npm run build

  frontend:dev:
    summary: Run the Vite frontend for Wails development mode
    dir: frontend
    deps:
      - frontend:install
    cmds:
      - npm run dev -- --port {{.WAILS_VITE_PORT | default 9245}} --strictPort

  generate:bindings:
    run: once
    summary: Generate the narrow Wails TypeScript Host bindings
    deps:
      - worker:assets
    cmds:
      - wails3 generate bindings -ts -i -clean=true

  build:
    summary: Build dsh-work for the current platform
    deps:
      - frontend:build
    cmds:
      - powershell -NoProfile -Command "New-Item -ItemType Directory -Path '{{.BIN_DIR}}' -Force | Out-Null"
      - go build -trimpath -buildvcs=false -o "{{.BIN_DIR}}/{{.APP_NAME}}{{exeExt}}" .

  build:smoke:
    summary: Build the real Windows DSH smoke harness
    platforms: [windows]
    cmds:
      - powershell -NoProfile -Command "New-Item -ItemType Directory -Path '{{.BIN_DIR}}' -Force | Out-Null"
      - go build -trimpath -buildvcs=false -o "{{.BIN_DIR}}/{{.APP_NAME}}-smoke.exe" ./cmd/dsh-work-smoke

  build:dsh-work:
    summary: Build the explicit dsh-work runtime/profile manager CLI
    cmds:
      - powershell -NoProfile -Command "New-Item -ItemType Directory -Path '{{.BIN_DIR}}' -Force | Out-Null"
      - go build -trimpath -buildvcs=false -o "{{.BIN_DIR}}/dsh-work-cli{{exeExt}}" ./cmd/dsh-work

  worker:assets:
    run: once
    summary: Generate the Worker Fetch adapter against the bundled Wails runtime
    deps:
      - frontend:install
    cmds:
      - node scripts/build-worker-bridge.mjs

  test:desktop:
    summary: Verify independent daemon/UI lifetime and real Worker streams
    platforms: [windows]
    deps:
      - build
      - build:dsh-work
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-desktop.ps1

  run:
    summary: Run the already-built dsh-work application
    cmds:
      - "{{.BIN_DIR}}/{{.APP_NAME}}{{exeExt}}"

  dev:
    summary: Run the Wails development loop
    cmds:
      - wails3 dev -config ./build/config.yml

  setup:dsh:
    summary: Explicitly install the pinned local DSH runtime
    dir: tools/dsh
    cmds:
      - npm install --package-lock-only --ignore-scripts
      - npm install --ignore-scripts

  test:windows-real-dsh:
    summary: Run the real Windows DSH tracer-bullet smoke test
    platforms: [windows]
    deps:
      - build
      - build:smoke
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run-real-dsh.ps1
