name: dsh-work PC

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Keep these job names stable: main branch protection requires these contexts.
  shared-contracts:
    name: Shared contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.14
          cache: true
          cache-dependency-path: go.sum

      - name: Install Wails Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev

      # Frontend checks are platform-agnostic; run them once on Ubuntu.
      - name: Set up Node
        if: runner.os == 'Linux'
        uses: actions/setup-node@v5
        with:
          node-version: '>=24'
          check-latest: true
          package-manager-cache: false

      - name: Verify Node and npm lock
        if: runner.os == 'Linux'
        run: node scripts/verify-node.mjs

      - name: Check public content
        if: runner.os == 'Linux'
        run: node scripts/check-public-content.mjs

      - name: Install frontend dependencies
        if: runner.os == 'Linux'
        run: npm ci --prefix frontend

      - name: Frontend tests and typecheck
        if: runner.os == 'Linux'
        run: |
          npm run --prefix frontend test
          npm run --prefix frontend typecheck

      - name: Go tests
        run: go test ./internal/...
      - name: Build Go packages
        run: go build ./internal/...

  windows-build:
    name: Windows Wails build
    runs-on: windows-latest
    env:
      WAILS_CLI_VERSION: v3.0.0-beta.16
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.14
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '>=24'
          check-latest: true
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          package-manager-cache: false

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend assets
        run: npm run --prefix frontend build

      - name: Cache Wails CLI
        id: wails-cli-cache
        uses: actions/cache@v6
        with:
          path: ~/go/bin/wails3.exe
          key: wails-cli-${{ runner.os }}-${{ runner.arch }}-go-1.25.14-${{ env.WAILS_CLI_VERSION }}

      - name: Install Wails CLI
        if: steps.wails-cli-cache.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_CLI_VERSION }}

      - name: Verify Wails CLI
        run: wails3 version

      - name: Resolve NSIS version
        id: nsis-version
        run: |
          $nsisVersion = (Get-Content toolchain.lock.json -Raw | ConvertFrom-Json).nsis.version
          "version=$nsisVersion" >> $env:GITHUB_OUTPUT

      - name: Cache NSIS
        id: nsis-cache
        uses: actions/cache@v6
        with:
          path: 'C:\Program Files (x86)\NSIS'
          key: nsis-${{ runner.os }}-${{ runner.arch }}-${{ steps.nsis-version.outputs.version }}

      - name: Install NSIS
        if: steps.nsis-cache.outputs.cache-hit != 'true'
        run: choco install nsis --version=${{ steps.nsis-version.outputs.version }} --yes --no-progress

      - name: Verify NSIS
        run: |
          $nsisBin = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          Add-Content -Path $env:GITHUB_PATH -Value $nsisBin
          & (Join-Path $nsisBin 'makensis.exe') /VERSION

      - name: Build application
        run: wails3 build

      - name: Build per-user Windows installer
        run: wails3 package GOOS=windows ARCH=amd64

      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: dsh-work-windows-amd64-installer
          path: |
            bin/dsh-work-*-windows-amd64-installer.exe
            bin/dsh-work-*-windows-amd64-installer.exe.sha256

      - name: Run Windows Go suite
        run: go test . ./cmd/...
