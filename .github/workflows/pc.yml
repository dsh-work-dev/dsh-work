name: Work PC

on:
  push:
  pull_request:

jobs:
  shared-contracts:
    name: Shared contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-13
          - ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.14
          cache: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          check-latest: true

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Frontend tests and typecheck
        run: |
          npm run --prefix frontend test
          npm run --prefix frontend typecheck

      - name: Shared Go contracts
        run: go test ./internal/...

  windows-build:
    name: Windows Wails build
    runs-on: windows-latest
    needs: shared-contracts
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.14
          cache: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          check-latest: true

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16

      - name: Build application
        run: wails3 build

      - name: Run Windows Go suite
        run: go test . ./cmd/... ./internal/...
