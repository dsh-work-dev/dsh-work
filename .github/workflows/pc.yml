name: dsh-work PC

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Keep these job names stable: main branch protection requires these contexts.
  shared-contracts:
    name: Shared contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.14
          cache: true
          cache-dependency-path: go.sum

      - name: Install Wails Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev

      # Frontend checks are platform-agnostic; run them once on Ubuntu.
      - name: Set up Node
        if: runner.os != 'Windows'
        uses: actions/setup-node@v5
        with:
          node-version: '>=24'
          check-latest: true
          package-manager-cache: false

      - name: Verify Node and npm lock
        if: runner.os == 'Linux'
        run: node scripts/verify-node.mjs

      - name: Check public content
        if: runner.os == 'Linux'
        run: node scripts/check-public-content.mjs

      - name: Test release feed promotion
        if: runner.os == 'Linux'
        run: bash .github/workflows/promote-feed.test.sh .github/workflows/promote-feed.sh

      - name: Install frontend dependencies
        if: runner.os == 'Linux'
        run: npm ci --prefix frontend

      - name: Frontend tests and typecheck
        if: runner.os == 'Linux'
        run: |
          npm run --prefix frontend test
          npm run --prefix frontend typecheck

      - name: Go tests
        if: runner.os != 'macOS'
        run: go test ./internal/...
      - name: Build macOS Worker IPC bridge
        if: runner.os == 'macOS'
        run: node scripts/build-workeripc-mac.mjs --output-dir "$RUNNER_TEMP/e67-mac-bridge"
      - name: macOS Go tests with bundled Worker IPC bridge
        if: runner.os == 'macOS'
        run: go test -exec "node \"$GITHUB_WORKSPACE/scripts/with-workeripc-mac.mjs\" --asset \"$RUNNER_TEMP/e67-mac-bridge/workeripc-mac.node\"" ./internal/...
      - name: Build Go packages
        run: go build ./internal/...

  macos-build:
    name: macOS arm64 Wails build
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CEF_ARCHIVE: cef_binary_156.0.15+gcf671c0+chromium-156.0.8078.80_macosarm64
      CEF_ARCHIVE_SHA1: 77fc8778dfd008c6c85c1668b38462597804dc89
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.14
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '>=24.9.0'
          check-latest: true
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          package-manager-cache: false

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16

      - name: Download pinned macOS CEF SDK
        run: |
          archive="$RUNNER_TEMP/$CEF_ARCHIVE.tar.bz2"
          encoded_name="${CEF_ARCHIVE//+/%2B}"
          curl --fail --location --retry 3 --output "$archive" "https://cef-builds.spotifycdn.com/$encoded_name.tar.bz2"
          printf '%s  %s\n' "$CEF_ARCHIVE_SHA1" "$archive" | shasum -a 1 -c -
          tar -xjf "$archive" -C "$RUNNER_TEMP"
          rm "$archive"

      - name: Build and verify macOS disk image
        run: wails3 task package:darwin DSH_WORK_MAC_CEF_SDK="$RUNNER_TEMP/$CEF_ARCHIVE"

      - name: Upload macOS disk image
        uses: actions/upload-artifact@v6
        with:
          name: dsh-work-macos-arm64-dmg
          path: bin/macos/build-*/DSH Work.dmg
          if-no-files-found: error

  windows-build:
    name: Windows Wails build
    runs-on: windows-latest
    env:
      WAILS_CLI_VERSION: v3.0.0-beta.16
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.14
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '>=24'
          check-latest: true
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          package-manager-cache: false

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend assets
        run: npm run --prefix frontend build

      - name: Cache Wails CLI
        id: wails-cli-cache
        uses: actions/cache@v6
        with:
          path: ~/go/bin/wails3.exe
          key: wails-cli-${{ runner.os }}-${{ runner.arch }}-go-1.25.14-${{ env.WAILS_CLI_VERSION }}

      - name: Install Wails CLI
        if: steps.wails-cli-cache.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_CLI_VERSION }}

      - name: Verify Wails CLI
        run: wails3 version

      - name: Resolve NSIS version
        id: nsis-version
        run: |
          $nsisVersion = (Get-Content toolchain.lock.json -Raw | ConvertFrom-Json).nsis.version
          "version=$nsisVersion" >> $env:GITHUB_OUTPUT

      - name: Cache NSIS
        id: nsis-cache
        uses: actions/cache@v6
        with:
          path: 'C:\Program Files (x86)\NSIS'
          key: nsis-${{ runner.os }}-${{ runner.arch }}-${{ steps.nsis-version.outputs.version }}

      - name: Install NSIS
        if: steps.nsis-cache.outputs.cache-hit != 'true'
        run: choco install nsis --version=${{ steps.nsis-version.outputs.version }} --yes --no-progress

      - name: Verify NSIS
        run: |
          $nsisBin = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          Add-Content -Path $env:GITHUB_PATH -Value $nsisBin
          & (Join-Path $nsisBin 'makensis.exe') /VERSION

      - name: Build application
        run: |
          node scripts/sync-version.mjs
          ./scripts/build-windows.ps1 -Arch amd64

      - name: Build per-user Windows installer
        run: ./scripts/package-windows.ps1 -Arch amd64

      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: dsh-work-windows-amd64-installer
          path: |
            bin/dsh-work-*-windows-amd64-installer.exe
            bin/dsh-work-*-windows-amd64-installer.exe.sha256
          if-no-files-found: error

      - name: Run Windows Go suite
        run: go test . ./cmd/...
